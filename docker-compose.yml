services:
  sourcebot:
    image: ghcr.io/sourcebot-dev/sourcebot:latest
    user: sourcebot
    depends_on:
      - postgres
      - redis
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: ingress
    volumes:
      - sourcebot_data:/data
    configs:
      - source: sourcebot_config
        target: /data/config.json
    environment:
      - CONFIG_PATH=/data/config.json
      - AUTH_URL=${AUTH_URL:-http://localhost:3000}
      - AUTH_SECRET=${AUTH_SECRET:-000000000000000000000000000000000}
      - SOURCEBOT_ENCRYPTION_KEY=${SOURCEBOT_ENCRYPTION_KEY:-000000000000000000000000000000000}
      - DATABASE_URL=postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/postgres
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - SOURCEBOT_EE_LICENSE_KEY=${SOURCEBOT_EE_LICENSE_KEY:-}
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  postgres:
    image: docker.io/postgres:${POSTGRES_VERSION:-16}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER}"]
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - sourcebot_postgres_data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  redis:
    image: docker.io/redis:${REDIS_VERSION:-8}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    volumes:
      - sourcebot_redis_data:/data
    deploy:
      replicas: 1
      restart_policy:
        condition: any

configs:
  sourcebot_config:
    external: true

volumes:
  sourcebot_data:
    driver: local
  sourcebot_postgres_data:
    driver: local
  sourcebot_redis_data:
    driver: local
